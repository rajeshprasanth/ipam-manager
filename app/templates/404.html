{% extends "public_base.html" %}
{% block title %}Page not found | {{ app_name }}{% endblock %}
{% block content %}
<div class="not-found text-center py-5">
    <div class="display-1 fw-bold text-primary">404</div>
    <h3 class="mt-2">Page not found</h3>
    <p class="text-muted">The page you requested does not exist or has been moved.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-2"><i class="bi bi-house me-2"></i>Back to home</a>
</div>
{% endblock %}
